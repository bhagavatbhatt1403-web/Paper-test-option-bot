name: BTC Paper Trading Bot

on:
  schedule:
    - cron: "35 * * * *"     # every hour at :35 UTC (= :05 IST)
  workflow_dispatch:          # manual run from the Actions tab

permissions:
  contents: write             # lets the bot save paper_state.json (its trade book)

concurrency:
  group: paper-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get latest trade book
        run: git pull --ff-only origin main || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run paper trading bot
        env:
          PAPER_BOT_TOKEN: ${{ secrets.PAPER_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: python paper_bot.py
      - name: Save trade book
        if: always()
        run: |
          if [ -f paper_state.json ]; then
            git config user.name "paper-bot"
            git config user.email "paper-bot@users.noreply.github.com"
            git add paper_state.json
            git diff --cached --quiet || (git commit -m "paper: update trades [skip ci]" && git pull --rebase -X theirs origin main && git push origin HEAD:main)
          fi
          
